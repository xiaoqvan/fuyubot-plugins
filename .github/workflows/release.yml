# 发布插件：全平台编 cdylib，按 bundle 契约打 zip 挂到 Release。
#
# 打出来的是**一个插件一个 zip**（不是本体发布包）：
#   <plugin-id>-<版本>-<平台>.zip
#     ├── plugin.json        entry 指向 bin/ 下的动态库
#     └── bin/<动态库>
# 平台名与 `crates/fuyubot-loader` 的 `current_platform()` 同一套口径：
# windows / linux / macos / android × x86_64 / aarch64（macOS 只有 aarch64）。
#
# ## 两种 tag
#
# 本仓库一个仓库八个插件，版本各自独立，所以默认按**单插件 tag** 发布：
#
#   fuyubot.adblock-v0.1.2     只构建 / 发布 fuyubot-plugin-adblock，版本取 0.1.2
#   fuyubot.help-v0.1.3        只构建 / 发布 fuyubot-plugin-help，版本取 0.1.3
#
# 旧的整体 tag `v0.1.2` 仍然兼容：八个插件全部按 0.1.2 打包，挂到同一个 Release。
# 插件 id → crate 目录由 `crates/*/plugin.json` 里的 `id` 现场匹配，不在 workflow 里
# 维护第二份映射。
#
# ⚠️ 本仓库用 path 依赖指向 ../FuyuBot，所以两个仓库都要 checkout，
# 且必须是兄弟目录（fuyubot-plugins 的 ../FuyuBot）。
#
# 桌面与 Android 分成两个 job：Android 要用 NDK + cargo-ndk 交叉编译，
# 和另外五个 runner 的步骤没有交集。`release` 把两边的 artifact 合到一个 Release。
name: release

on:
  push:
    tags: ["v*", "*-v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 从 tag 里解出「这次发哪个插件、版本是多少」。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.scope.outputs.version }}
      plugins: ${{ steps.scope.outputs.plugins }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" =~ ^(.+)-v([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            plugin_id="${BASH_REMATCH[1]}"
            version="${BASH_REMATCH[2]}"
            plugins=""
            for manifest in crates/*/plugin.json; do
              id=$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["id"])' "$manifest")
              if [[ "$id" == "$plugin_id" ]]; then
                plugins="${manifest#crates/}"
                plugins="${plugins%/plugin.json}"
                break
              fi
            done
            if [[ -z "$plugins" ]]; then
              echo "::error::tag $tag 里的插件 id $plugin_id 在 crates/*/plugin.json 里找不到"
              exit 1
            fi
          else
            version="${tag#v}"
            plugins="fuyubot-plugin-sqlite fuyubot-plugin-mongo fuyubot-plugin-adblock fuyubot-plugin-html2img fuyubot-plugin-help fuyubot-plugin-douyin fuyubot-plugin-music fuyubot-plugin-message-log"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"
          echo "发布范围：$plugins，版本 $version"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: windows-11-vs2026-arm
            platform: windows-aarch64
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-latest
            platform: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      # 两个仓库都要，且是兄弟目录：都在 $GITHUB_WORKSPACE 下面，
      # cargo 的工作目录是 fuyubot-plugins/，`../FuyuBot` 正好解析到运行时仓库。
      - uses: actions/checkout@v4
        with:
          path: fuyubot-plugins
      - uses: actions/checkout@v4
        with:
          repository: CatMoeCircle/Fuyu-Bot
          path: FuyuBot
      - uses: dtolnay/rust-toolchain@stable
      - name: Install fontconfig (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev pkg-config
      - name: Build
        shell: bash
        working-directory: fuyubot-plugins
        env:
          PLUGINS: ${{ needs.prepare.outputs.plugins }}
        run: |
          set -euo pipefail
          packages=()
          for plugin in $PLUGINS; do
            packages+=(-p "$plugin")
          done
          cargo build --release "${packages[@]}"
      - name: Package
        shell: bash
        working-directory: fuyubot-plugins
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLUGINS: ${{ needs.prepare.outputs.plugins }}
        run: |
          for plugin in $PLUGINS; do
            python scripts/package.py --plugin "$plugin" --platform "${{ matrix.platform }}" --version "$VERSION"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: fuyubot-plugins/dist/*.zip
          if-no-files-found: error

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: fuyubot-plugins
      - uses: actions/checkout@v4
        with:
          repository: CatMoeCircle/Fuyu-Bot
          path: FuyuBot
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      # `rusqlite` 的 bundled SQLite 是 C 源码，Android 上由 cargo-ndk 把
      # NDK 的 clang 塞进 CC/AR，交叉编译才会走到正确的 sysroot。
      - name: Build
        shell: bash
        working-directory: fuyubot-plugins
        env:
          PLUGINS: ${{ needs.prepare.outputs.plugins }}
        run: |
          set -euo pipefail
          packages=()
          for plugin in $PLUGINS; do
            packages+=(-p "$plugin")
          done
          cargo ndk -t arm64-v8a -t x86_64 --platform 24 build --release "${packages[@]}"
      - name: Package
        shell: bash
        working-directory: fuyubot-plugins
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLUGINS: ${{ needs.prepare.outputs.plugins }}
        run: |
          for plugin in $PLUGINS; do
            python scripts/package.py --plugin "$plugin" --platform android-aarch64 --version "$VERSION"
            python scripts/package.py --plugin "$plugin" --platform android-x86_64 --version "$VERSION"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: fuyubot-plugins/dist/*.zip
          if-no-files-found: error

  release:
    needs: [prepare, build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
