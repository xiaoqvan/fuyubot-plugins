[workspace]
members = ["crates/*", "vendor/hyper-render"]
default-members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CatMoeCircle/fuyubot-plugins"

# ⚠️ `fuyubot-abi` 只在运行时仓库（Fuyu-Bot）里发——这里走 path。
# 本仓库假定与 FuyuBot checkout **并排**放在同一父目录下：
#
#     <父目录>/
#     ├── FuyuBot/          # 运行时仓库
#     └── fuyubot-plugins/  # 本仓库
#
# 换目录布局就改下面这行（或者改成 crates.io / git 依赖）。
#
# `version` 是**编译期守卫**：ABI v6 从 `fuyubot-abi` 0.1.3 起（v5 是 0.1.2 及更早，
# 两者硬不兼容：v5 插件在 v6 宿主上会被拒绝加载，反之亦然）。旁边的 FuyuBot checkout
# 太旧时这里直接报错，不会静默编出一个 v5 插件。0.1.x 内升级（0.1.4 …）仍然兼容。
# `fuyubot-simplify`（`publish = false`）**不依赖**：裁剪版内联在
# adblock 的 `src/simplify.rs`，发送走 ABI v5 的 `simplify_invoke` op 表
# （v6 只把**服务调用**改走宿主，simplify 通道没变）。
[workspace.dependencies]
fuyubot-abi = { path = "../FuyuBot/crates/fuyubot-abi", version = "0.1.3" }

# 五个插件共享的第三方依赖，版本只写在这一处。
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# `vue-template-html`（独立可发布的库 crate，不是插件）只用 serde_json；
# 错误类型手写 Display/Error，不额外引 thiserror，保持依赖树最小。
# adblock 的 OpenAI 兼容接口：同步阻塞 + 能逐条控制请求头/超时。
# 用 rustls（FuyuBot 本体也是这套）：不依赖系统证书栈，跨平台行为一致。
# ⚠️ rustls 的 ring 要在构建机上编 C 代码，Windows 下 MSVC 工具链必须和 vcvars 对上，
# 否则会出 `cl : Command line error D8050`——排障见 adblock README「Windows 上的两个坑」。
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
# mongo 插件：官方驱动 + bson。
# `chrono-0_4`：让 `DateTime<Utc>` 直接映射成 BSON `Date`（与 TS 版写入的
# `new Date()` 字段二进制兼容）；`serde` + `serde_json-1`：Extended JSON 互转。
bson = { version = "3", features = ["chrono-0_4", "serde", "serde_json-1"] }
mongodb = { version = "3", features = ["bson-3"] }
futures-util = "0.3.34"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "time"] }
# sqlite 插件：`bundled` 把 SQLite 源码编进插件，不依赖系统库。
rusqlite = { version = "0.40.2", features = ["bundled"] }
# html2img 插件：纯 Rust 的 HTML → PNG 渲染（Blitz + Stylo + Vello CPU，不带 Chromium）。
# 只开 `png`：默认的 `pdf` 会额外拖进 krilla / parley，而插件只发图片。
# 本地 vendored fork：thomasmost/hyper-render 的 PR #1（blitz 0.3.0-alpha.4 +
# DataUrlNetProvider + StyleThreading）。provenance 见 vendor/hyper-render/LOCAL.md。
hyper-render = { path = "vendor/hyper-render", default-features = false, features = ["png"] }
# html2img 插件：可选地把 Vue 模板先编译成 HTML 再渲染。
# 同仓库的独立库 crate（不是插件），只依赖 serde_json。
vue-template-html = { path = "crates/vue-template-html" }
# html2img 插件：PNG → JPEG 转码（`image` 本来就在依赖树里，这里只额外开 jpeg 编解码）。
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# 本地迭代：比 dev 略高优化，保留调试信息。
[profile.debug]
inherits = "dev"
opt-level = 1

# 插件是 cdylib（宿主 dlopen 出来的动态库）。
# ⚠️ 不要加 `panic = "abort"`：`define_plugin!` 靠 `catch_unwind` 兜住插件里的 panic，
# abort 会让一次插件崩直接带走整个宿主进程。
[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
